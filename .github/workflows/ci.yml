# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: 0 23 * * * 
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          version: 'latest'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: Install Python dependencies
        run: uv sync --no-dev
      - name: Create test temporary directory
        run: mkdir -p .scratch/tmp
      - name: Run Python regression tests
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/tmp
          TMP: ${{ github.workspace }}/.scratch/tmp
          TEMP: ${{ github.workspace }}/.scratch/tmp
        run: uv run --no-sync python -m unittest discover -v
  build:
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: true
          cache: 'maven'
      - name: Build and test with Maven
        run: mvn -B verify --file pom.xml
      - name: Run Java Application
        run: java -jar target/bing-wallpaper-jar-with-dependencies.jar
      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "AgentPhoenix7@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md bing-wallpaper.md
          if ! git diff --cached --quiet; then
            git commit -m "Update README.md & bing-wallpaper.md"
            git push
          else
            echo "No changes to commit."
          fi
